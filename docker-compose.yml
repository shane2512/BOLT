services:
  # Local Postgres for dev, standing in for the Supabase pooler that this
  # sandbox's outbound network policy blocks (ports 5432/6543 are firewalled,
  # only 443 is open — confirmed directly, not assumed). Schema and data here
  # are separate from the real Supabase instance; this is a scratch database
  # for exercising DB-backed flows locally, not a copy of production state.
  postgres:
    image: postgres:16-alpine
    container_name: bolt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bolt
      POSTGRES_PASSWORD: bolt
      POSTGRES_DB: bolt
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bolt-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolt -d bolt"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  bolt-postgres-data:
