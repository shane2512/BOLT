# BOLT subgraph manifest.
#
# network: "arc-testnet" — The Graph's own identifier for Arc testnet
#   (https://thegraph.com/docs/en/supported-networks/arc-testnet/, chain
#   eip155:5042002). Confirmed supported by Subgraph Studio before any of this
#   was written; see docs/evidence/phase4-summary.json.
# specVersion / apiVersion / indexerHints shape per graphprotocol/subgraphs-skills
#   skills/subgraph-dev/SKILL.md § "Manifest Configuration".
# startBlock 60893705 — the block BoltRegistry's code first appears at, found by
#   binary search on eth_getCode against the Arc RPC (the RPC prunes logs, so
#   eth_getLogs from 0 returns "pruned history unavailable").
specVersion: 1.3.0
description: BOLT — beneficiary-only ledger transfers. Coverage through time on Arc.
schema:
  file: ./schema.graphql
indexerHints:
  prune: never
dataSources:
  - kind: ethereum/contract
    name: BoltRegistry
    network: arc-testnet
    source:
      address: "0x654713c0554cf3286e140C876E49F15B3F9dA0cd"
      abi: BoltRegistry
      startBlock: 60893705
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/registry.ts
      entities:
        - Business
        - Account
        - PolicyRotation
        - Mandate
        - Deposit
        - Split
        - Obligation
        - ObligationSettlement
        - Unlock
        - Approval
        - RecorderChange
        - ClassPosition
        - CoverageSnapshot
      abis:
        - name: BoltRegistry
          file: ./abis/BoltRegistry.json
        - name: Usdc
          file: ./abis/Usdc.json
      eventHandlers:
        - event: BusinessRegistered(indexed bytes32,string,address)
          handler: handleBusinessRegistered
        - event: AccountRegistered(indexed bytes32,indexed address,uint8,bytes32,string)
          handler: handleAccountRegistered
        - event: PolicyRotated(indexed bytes32,indexed address,bytes32,bytes32,bytes32)
          handler: handlePolicyRotated
        - event: MandatePublished(indexed bytes32,uint256,bytes32,bytes32)
          handler: handleMandatePublished
        - event: DepositObserved(indexed bytes32,indexed bytes32,uint256,uint256)
          handler: handleDepositObserved
        - event: SplitExecuted(indexed bytes32,indexed address,uint256)
          handler: handleSplitExecuted
        - event: ObligationAccrued(indexed bytes32,indexed bytes32,address,bytes32,uint256)
          handler: handleObligationAccrued
        - event: ObligationSettled(indexed bytes32,uint256,bytes32)
          handler: handleObligationSettled
        - event: UnlockRequested(indexed bytes32,indexed bytes32,address,uint256,address,bytes32,uint256)
          handler: handleUnlockRequested
        - event: UnlockApproved(indexed bytes32,address,bytes32)
          handler: handleUnlockApproved
        - event: UnlockExecuted(indexed bytes32,uint256)
          handler: handleUnlockExecuted
        - event: UnlockCancelled(indexed bytes32,bytes32)
          handler: handleUnlockCancelled
        - event: RecorderUpdated(indexed address,indexed address)
          handler: handleRecorderUpdated

  # USDC on Arc is the native gas token exposed through an ERC-20 interface at
  # 0x3600…0000 over the same underlying balance (docs/evidence/PHASE0_DOC_RESEARCH.md).
  # Indexing its Transfer logs is what makes `held` chain-derived rather than
  # whatever our backend claims it split (CLAUDE.md invariant 8). The handler
  # early-returns unless a registered BOLT account is on one side.
  - kind: ethereum/contract
    name: Usdc
    network: arc-testnet
    source:
      address: "0x3600000000000000000000000000000000000000"
      abi: Usdc
      startBlock: 60893705
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/usdc.ts
      entities:
        - Account
        - UsdcTransfer
        - ClassPosition
        - CoverageSnapshot
      abis:
        - name: Usdc
          file: ./abis/Usdc.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleUsdcTransfer
